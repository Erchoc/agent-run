name: build-agent-image

on:
  schedule:
    # 每周一 02:00 UTC(北京时间 10:00)自动重建,跟进 agent CLI 周更
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      claude_code_version:
        description: 'Claude Code 版本(留空 = npm 最新)'
        required: false
        default: ''
      codex_version:
        description: 'Codex 版本(留空 = npm 最新)'
        required: false
        default: ''
      anthropic_base_url:
        description: 'Anthropic API 端点(留空 = 用 secret 或官方默认)'
        required: false
        default: ''
      anthropic_model:
        description: 'Claude 模型 ID(留空 = CLI 默认)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/build.yml'

env:
  # 通过 secret 覆盖以支持企业版 ACR 或其他 registry
  # 个人版: registry.cn-hangzhou.aliyuncs.com  企业版: <instance>.cn-hangzhou.cr.aliyuncs.com
  ACR: ${{ secrets.ACR_REGISTRY || 'registry.cn-hangzhou.aliyuncs.com' }}
  NS: ${{ secrets.ACR_NAMESPACE || 'dfctl' }}
  IMAGE: agent-env

jobs:
  build:
    # 原生 arm64 runner:免 QEMU、构建快,产物直接对应 Apple container (arm64)
    # 私有仓库若不可用,改为 ubuntu-latest 并取消下方 QEMU 步骤的注释
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: 解析 Agent CLI 版本
        id: ver
        run: |
          CC="${{ inputs.claude_code_version }}"
          CX="${{ inputs.codex_version }}"
          [ -z "$CC" ] && CC=$(npm view @anthropic-ai/claude-code version)
          [ -z "$CX" ] && CX=$(npm view @openai/codex version)
          echo "claude=$CC"  >> "$GITHUB_OUTPUT"
          echo "codex=$CX"   >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "构建版本: claude-code=$CC codex=$CX"

      # - uses: docker/setup-qemu-action@v4   # 仅 amd64 runner 交叉构建时需要
      - uses: docker/setup-buildx-action@v4

      - name: 登录 ACR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建镜像(本地加载,先测后推)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ${{ env.IMAGE }}:candidate
          build-args: |
            CLAUDE_CODE_VERSION=${{ steps.ver.outputs.claude }}
            CODEX_VERSION=${{ steps.ver.outputs.codex }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        run: bash scripts/smoke-test.sh ${{ env.IMAGE }}:candidate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ inputs.anthropic_base_url || secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ inputs.anthropic_model || secrets.ANTHROPIC_MODEL }}

      - name: 推送 ACR(latest + 日期 tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ACR }}/${{ env.NS }}/${{ env.IMAGE }}:latest
            ${{ env.ACR }}/${{ env.NS }}/${{ env.IMAGE }}:${{ steps.ver.outputs.date }}
          build-args: |
            CLAUDE_CODE_VERSION=${{ steps.ver.outputs.claude }}
            CODEX_VERSION=${{ steps.ver.outputs.codex }}
          cache-from: type=gha

      - name: 构建摘要
        run: |
          {
            echo "## agent-env 构建完成 ✅"
            echo "- claude-code: \`${{ steps.ver.outputs.claude }}\`"
            echo "- codex: \`${{ steps.ver.outputs.codex }}\`"
            echo "- 镜像: \`${{ env.ACR }}/${{ env.NS }}/${{ env.IMAGE }}:${{ steps.ver.outputs.date }}\`(同步更新 :latest)"
            echo ""
            echo "Mac Mini 拉取:"
            echo '```'
            echo "container pull ${{ env.ACR }}/${{ env.NS }}/${{ env.IMAGE }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
